name: Test
on:
  workflow_call:
  workflow_dispatch:
  # Every push but to main, which gets its tests from release.yml
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/test.yml'
      - 'packages/**/*.ts'
      - 'packages/**/*.js'
      - 'packages/**/*.cjs'
      - 'packages/**/*.mjs'
      - '**/package.json'
      - '**/tsconfig*.json'
      - '**/.mocharc.*'
      - '.c8rc.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

# This workflow only reads the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Tests'
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'no-test')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: '24'
          rman-version: '2'
          install: 'ci'

      # Each module's tests, and before them `spm verify` (.rmanrc.yml
      # run.test.before): packed, installed as the engine does and its classes
      # loaded. spm compiles a module against the others' build output
      - name: Apply tests
        run: |
          rman check
          rman lint
          pnpm typecheck
          rman build
          rman run test

      # Every module's tests once more from the root, under c8 (.c8rc.json):
      # the coverage of all modules in one table
      - name: Coverage
        run: pnpm run citest

      # The coverage badge reads Coveralls. Until Coveralls knows the
      # repository, a failed upload does not fail the tests
      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
